name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            type: dmg
          - os: windows-latest
            type: msi
          - os: ubuntu-latest
            type: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build installer
        shell: bash
        run: ./gradlew :jmvs-app:jpackage --console=plain -Pjmvs.packageType=${{ matrix.type }} -Pjmvs.version=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: jmvs-${{ matrix.type }}
          path: jmvs-app/build/jpackage/*.${{ matrix.type }}

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "JMVS $GITHUB_REF_NAME" --generate-notes
