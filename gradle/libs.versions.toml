[versions]
gdx = "1.14.2"
# libGDX 1.14.2 depends on LWJGL 3.3.3, which does not recognise Java 25's JNI version; 3.3.6 does.
lwjgl = "3.3.6"
visui = "1.5.9"
ciftools = "9.0.0"
junit = "6.1.3"
assertj = "3.27.7"

[libraries]
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl-tinyfd = { module = "org.lwjgl:lwjgl-tinyfd" }
visui = { module = "com.kotcrab.vis:vis-ui", version.ref = "visui" }
ciftools = { module = "org.rcsb:ciftools-java", version.ref = "ciftools" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
