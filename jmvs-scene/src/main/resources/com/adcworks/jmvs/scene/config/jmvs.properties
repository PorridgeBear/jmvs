################################################################################
# Display modes and colour schemes (ids; order is the menu order)
################################################################################

display.modes=balls,sticks,ballsandsticks,ribbons,cartoon
display.default=balls

colour.schemes=cpk,chain,group,structure,bfactor,confidence
colour.default=cpk

################################################################################
# CPK colours, indexed by the element table's CPK index (RasMol)
################################################################################

# light grey
cpk.0=200,200,200
# sky blue
cpk.1=143,143,255
# red
cpk.2=240,0,0
# yellow
cpk.3=255,200,50
# white
cpk.4=255,255,255
# pink
cpk.5=255,192,203
# golden rod
cpk.6=218,165,0
# blue
cpk.7=0,0,255
# orange
cpk.8=255,165,0
# dark grey
cpk.9=128,128,144
# brown
cpk.10=165,42,42
# purple
cpk.11=160,32,240
# deep pink
cpk.12=255,20,147
# green
cpk.13=0,255,0
# brick
cpk.14=178,34,34
# forest green
cpk.15=34,139,34

################################################################################
# Residue ("Group") colours (RasMol amino colours)
################################################################################

residue.asp=230,10,10
residue.glu=230,10,10
residue.lys=20,90,255
residue.arg=20,90,255
residue.his=130,130,210
residue.ser=250,150,0
residue.thr=250,150,0
# Legacy used yellow (230,230,0) despite a "cyan" comment; RasMol uses cyan.
# Legacy used yellow (230,230,0) despite a "cyan" comment; RasMol uses cyan.
residue.asn=0,220,220
residue.gln=0,220,220
residue.cys=230,230,0
residue.met=230,230,0
residue.ala=200,200,200
residue.gly=235,235,235
residue.leu=15,130,15
residue.val=15,130,15
residue.ile=15,130,15
residue.phe=50,50,170
residue.tyr=50,50,170
residue.trp=180,90,180
residue.pro=210,150,130
residue.pca=210,150,130
residue.hyp=210,150,130
residue.other=190,160,110

################################################################################
# Secondary structure colours
################################################################################

structure.helix=240,0,128
structure.sheet=255,255,0
structure.turn=96,128,255
structure.coil=255,255,255

################################################################################
# Chain colours, assigned in order of first appearance (semicolon-separated)
################################################################################

chain.palette=0,160,255;255,128,0;0,200,80;230,40,90;160,100,255;255,210,0;0,210,200;255,90,200;140,200,40;255,150,120;120,140,255;200,160,80

################################################################################
# B-factor gradient (B_iso_or_equiv), scaled to the structure's lowest and
# highest values: low -> mid -> high. Atoms without a B-factor use "missing".
################################################################################

bfactor.low=0,0,255
bfactor.mid=255,255,255
bfactor.high=255,0,0
bfactor.missing=128,128,128

################################################################################
# Confidence (pLDDT, stored in B_iso_or_equiv by AlphaFold), in the AlphaFold
# DB colours: very high > 90, confident 70-90, low 50-70, very low < 50
################################################################################

confidence.veryhigh=0,83,214
confidence.confident=101,203,243
confidence.low=255,219,19
confidence.verylow=255,125,69

################################################################################
# Molecular surfaces: solvent probe radius (Å), target grid spacing (Å), and
# the largest grid allocated (voxels); spacing is coarsened to fit
################################################################################

surface.probe=1.4
surface.spacing=0.5
surface.maxVoxels=8000000

################################################################################
# Density maps (cryo-EM): largest map held in memory (voxels; larger maps are
# binned), initial contour level (standard deviations above the mean), zone
# colouring radius (Å; 0 = off), colour away from the model, initial style
# (surface or mesh)
################################################################################

density.maxVoxels=32000000
density.sigma=2.5
density.zoneRadius=3.0
density.colour=150,160,175
density.style=mesh

################################################################################
# Cartoon (Å): helix and strand ribbon width and thickness, arrowhead base
# width, coil and nucleic-acid backbone tube radii, spline samples per residue
################################################################################

cartoon.helix.width=2.4
cartoon.helix.thickness=0.5
cartoon.sheet.width=2.0
cartoon.sheet.thickness=0.5
cartoon.arrow.width=3.4
cartoon.coil.radius=0.3
cartoon.nucleic.radius=0.8
cartoon.samples=8
